<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Hotel Booking System</title>
    <div th:replace="~{fragments/header :: head}"></div>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="hero-section">
        <h1>Find your next stay</h1>
        <p>Search low prices on hotels, homes and much more...</p>

        <div class="search-bar-container">
            <form class="search-form" th:action="@{/search}" method="get">
                
                <div class="form-group">
                    <label for="destination">Where are you going?</label>
                    <input type="text" id="destination" name="destination" placeholder="e.g. New York" required>
                </div>
                
                <div class="form-group">
                    <label for="checkin">Check-in</label>
                    <input type="date" id="checkin" name="checkin" required>
                </div>

                <div class="form-group">
                    <label for="checkout">Check-out</label>
                    <input type="date" id="checkout" name="checkout" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Search</button>
            </form>
            
             <div th:if="${searchError}" class="alert alert-danger" th:text="${searchError}"
                  style="margin-top: 1.5rem; max-width: 900px; margin-left: auto; margin-right: auto; box-sizing: border-box;">
             </div>
        </div>
    </div>

</body>
</html>
