<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Bookings</title>
    <div th:replace="~{fragments/header :: head}"></div>
     <style>
        /* These styles are copied from admin/hotels-list.html for consistency */
        .content-card {
            width: 100%;
            max-width: 900px;
            background-color: var(--bg-white);
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .booking-card { 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            margin-bottom: 1.5rem; 
            padding: 1.5rem; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.05); 
        }
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .booking-card h4 { 
            margin: 0; 
            color: var(--primary-color); 
        }
        .booking-details p { 
            margin-bottom: 0.3rem; 
            color: var(--text-light); 
        }
        .booking-details strong { 
            color: var(--text-dark); 
            min-width: 100px;
            display: inline-block;
        }
        .booking-status { 
            font-weight: 600; 
            text-transform: uppercase; 
            font-size: 0.9rem;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .status-confirmed { 
            color: var(--success); 
            background-color: #d4edda;
        }
        .status-cancelled { 
            color: var(--danger); 
            background-color: #f8d7da;
        }
        .status-refund_pending {
            color: #856404; /* Dark yellow */
            background-color: #fff3cd;
        }
        
        .flash-message { padding: 1rem; margin-bottom: 1rem; border-radius: 6px; text-align: center; }
        .flash-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .btn-small { padding: 5px 10px; font-size: 0.8rem; width: auto; margin: 0; }
        .btn-danger { background-color: var(--danger); color: white; border-color: var(--danger);}
        .btn-danger:hover { background-color: #c82333; border-color: #bd2130;}
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="content-container">
        <div class="content-card">
            <h2>My Bookings</h2>

            <div th:if="${successMessage}" class="flash-message flash-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="flash-message flash-error" th:text="${errorMessage}"></div>

             <div th:if="${#lists.isEmpty(bookings)}">
                <p>You haven't made any bookings yet.</p>
             </div>

            <div th:unless="${#lists.isEmpty(bookings)}">
                <div th:each="booking : ${bookings}" class="booking-card">
                    
                    <div class="booking-header">
                        <h4>Booking ID: #<span th:text="${booking.id}">123</span></h4>
                        <span class="booking-status"
                              th:classappend="${booking.status == 'CONFIRMED' ? 'status-confirmed' : (booking.status == 'CANCELLED' ? 'status-cancelled' : 'status-refund_pending')}"
                              th:text="${booking.status}">CONFIRMED</span>
                    </div>

                    <div class="booking-details">
                        <p><strong>Hotel:</strong> <span th:text="${booking.hotelName}">Hotel Name</span></p>
                        <p><strong>Room:</strong> <span th:text="${booking.roomType}">Room Type</span></p>
                        <p><strong>Check-in:</strong> <span th:text="${#temporals.format(booking.checkInDate, 'EEE, dd MMM yyyy')}"></span></p>
                        <p><strong>Check-out:</strong> <span th:text="${#temporals.format(booking.checkOutDate, 'EEE, dd MMM yyyy')}"></span></p>
                        
                        <div th:if="${booking.status == 'CONFIRMED'}" style="margin-top: 1rem; text-align: right;">
                            <form th:action="@{/booking/cancel/{bookingId}(bookingId=${booking.id})}" method="post" 
                                  onsubmit="return confirm('Are you sure you want to cancel this booking?');">
                                <button type="submit" class="btn btn-danger btn-small">Cancel Booking</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
        </div> </div> </body>
</html>
