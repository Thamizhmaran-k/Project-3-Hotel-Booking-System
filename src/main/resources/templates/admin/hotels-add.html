<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Hotel</title>
    <div th:replace="~{fragments/header :: head}"></div>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="auth-container"> <div class="auth-card">
            <h2>Add New Hotel</h2>
            
            <form th:action="@{/admin/hotels/add}"
                  th:object="${hotel}"
                  method="post">
                
                <div class="form-group">
                    <label for="name">Hotel Name</label>
                    <input type="text" id="name" th:field="*{name}" />
                    <p th:if="${#fields.hasErrors('name')}" 
                       th:errors="*{name}" class="alert alert-danger"></p>
                </div>
                
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" th:field="*{city}" />
                    <p th:if="${#fields.hasErrors('city')}" 
                       th:errors="*{city}" class="alert alert-danger"></p>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}" />
                    <p th:if="${#fields.hasErrors('address')}" 
                       th:errors="*{address}" class="alert alert-danger"></p>
                </div>
                
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" rows="4" style="width: 100%; border: 1px solid var(--border-color); border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 1rem; padding: 0.75rem;"></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary">Save Hotel</button>
                
            </form>
        </div>
    </div>
</body>
</html>
