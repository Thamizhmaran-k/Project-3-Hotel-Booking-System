<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Rooms</title>
    <div th:replace="~{fragments/header :: head}"></div>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .content-card-full { width: 95%; max-width: 1200px; background-color: var(--bg-white); padding: 2.5rem; border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); box-sizing: border-box; margin: 2rem auto; }
        .styled-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9rem; }
        .styled-table thead tr { background-color: var(--primary-color); color: #ffffff; text-align: left; }
        .styled-table th, .styled-table td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); }
        .styled-table tbody tr:hover { background-color: #f1f1f1; }
        .btn-small { padding: 5px 10px; font-size: 0.8rem; width: auto; margin-right: 5px; display: inline-block; }
        .action-buttons form { display: inline-block; margin: 0; }
        .btn-danger { background-color: var(--danger); color: white; border-color: var(--danger);}
        .btn-danger:hover { background-color: #c82333; border-color: #bd2130;}
        .flash-message { padding: 1rem; margin-bottom: 1rem; border-radius: 6px; text-align: center; }
        .flash-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="content-container">
        <div class="content-card-full">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Rooms for <span th:text="${hotel.name}">Hotel Name</span></h2>
                <a th:href="@{/admin/hotels/{hotelId}/rooms/add(hotelId=${hotel.id})}" class="btn btn-primary" style="width: auto;">Add New Room</a>
            </div>
             <p><a th:href="@{/admin/hotels}">&laquo; Back to Hotels List</a></p>

            <div th:if="${successMessage}" class="flash-message flash-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="flash-message flash-error" th:text="${errorMessage}"></div>

            <div th:if="${#lists.isEmpty(rooms)}">
                <p>No rooms added for this hotel yet.</p>
            </div>

            <table class="styled-table" th:unless="${#lists.isEmpty(rooms)}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Room Type</th>
                        <th>Capacity</th>
                        <th>Price/Night</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="room : ${rooms}">
                        <td th:text="${room.id}">1</td>
                        <td th:text="${room.roomType}">Double</td>
                        <td th:text="${room.capacity}">2</td>
                        <td th:text="${#numbers.formatCurrency(room.pricePerNight)}">$150.00</td>
                        <td class="action-buttons">
                            <a th:href="@{/admin/rooms/edit/{roomId}(roomId=${room.id})}" class="btn btn-outline btn-small">Edit</a>
                            <form th:action="@{/admin/rooms/delete/{roomId}(roomId=${room.id})}" method="post" onsubmit="return confirm('Are you sure you want to delete this room?');">
                                <button type="submit" class="btn btn-danger btn-small">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>
    </div>
</body>
</html>
